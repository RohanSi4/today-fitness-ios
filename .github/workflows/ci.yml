name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PROJECT: Health Tracker.xcodeproj
      APP_SCHEME: Health Tracker
      WIDGET_SCHEME: TodayWidget

    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          swift --version

      # The runner image changes its simulator lineup over time, so pick a device
      # at run time instead of hardcoding a name that can silently disappear.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              raw = runtime.split("iOS-")[-1]
              try:
                  version = tuple(int(p) for p in raw.split("-"))
              except ValueError:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  if "iPhone" not in name:
                      continue
                  # Rank by model NUMBER, not by name. Sorting on the name
                  # picked "iPhone SE (3rd generation)" over "iPhone 17 Pro",
                  # because "S" > "1" lexicographically, so CI silently ran on
                  # the slowest device in the lineup instead of the newest.
                  model = re.search(r"iPhone (\d+)", name)
                  rank = int(model.group(1)) if model else -1
                  # Then by trim, or the name tiebreak picks "iPhone 17e" over
                  # "iPhone 17 Pro" ("e" > " ").
                  if "Pro Max" in name: trim = 3
                  elif "Pro" in name: trim = 2
                  elif "Plus" in name: trim = 1
                  else: trim = 0
                  key = (version, rank, trim, name)
                  if best is None or key > best[0]:
                      best = (key, device)
          if best is None:
              sys.exit("No available iPhone simulator on this runner")
          device = best[1]
          print(device["udid"])
          ' )
          name=$(xcrun simctl list devices available | grep "$udid" | sed 's/ (.*//; s/^ *//')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $name ($udid)"

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build the widget extension
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$WIDGET_SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Runs both bundles: 206 swift-testing unit tests and 11 XCUITest cases,
      # minus ScreenshotWalkthrough. That bundle is a screenshot harness, not an
      # assertion suite: its own header says it is kept out of the normal run.
      # It also depends on locally seeded state (tools/seed-active-workout.sh),
      # so on a clean runner it asserts against whatever the mock data happens
      # to hold, and it is slow enough to push this job past 27 minutes.
      # HealthKit is unavailable in Simulator, so the app takes its mock and
      # simulator-only paths here. Real Health reads and body-mass writes still
      # need a physical iPhone.
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:"Health TrackerUITests/ScreenshotWalkthrough" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Summarize results
        if: always()
        run: |
          set -uo pipefail
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("summary.json"))
          print("| metric | value |")
          print("| --- | --- |")
          for key in ("result", "passedTests", "failedTests", "skippedTests"):
              print(f"| {key} | {data.get(key)} |")
          PY

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
